{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Log In{% endblock title %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">

        <div style="text-align: center; margin-top: 50px; margin-bottom: 20px; font-size: 50px; font-family: Quicksand;">
            <a>Log In</a>
        </div>


        <form method="post" class="text-box">
            {% csrf_token %}

             <div class="row justify-content-center">
                <div class="col-md-6">
                    {{ form|crispy }}
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-6">
                    <button class="btn btn-success w-100" type="submit" id="login-btn">Log In</button>
                </div>
            </div>

            <div class="row justify-content-center">
                    <a style="text-align: center; margin-bottom: 10px; margin-top: 40px; font-family: Quicksand;">Don't have an account?</a>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-6">
                    <a href="{% url 'signup' %}" class="btn btn-success w-100" id="signup-btn">Sign Up</a>                
                </div>
            </div>

        </form>
    </div>
</div>
{% endblock content %}
