{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Sign Up{% endblock title %}

{% block content %}
<h2>Sign Up</h2>
<form method="post" class="text-box">{% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-success" type="submit" id="signup-btn">Sign Up</button>
</form>
{% endblock content %}
