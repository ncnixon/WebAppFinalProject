{% load static %}
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tutoring App{% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'styles/griz_style.css' %}">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="base-body">
    <nav class="navbar navbar-expand-lg bg-body-tertiary" style="padding:0">
    <div class="container-fluid" id="nav-bar">
        <a class="navbar-brand" href="{% url 'home' %}">TutorMePlease</a>
        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            {% if user.is_authenticated %}
            <!-- <li><a href="#" class="nav-link px-2 link-dark">+ New</a></li> -->
        </ul>
        <div class="mr-auto">
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        {{ user.username }}
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" style="background-color: #fdf1db;">
                        <li><a class="dropdown-item" href="{% url 'password_change' %}" style="color: #082434">
                            Change password</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <form method="post" action="{% url 'logout' %}"
                                style="display:inline;">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-link nav-link"
                                    style="display:inline; cursor:pointer; color: #082434;" >Logout</button>
                            </form>
                        </li>
                    </ul>
                </li>
                    {% else %}
                </ul>
            </div>
            <div class="mr-auto">
                <form class="form d-flex">
                    <a href="{% url 'login' %}" class="btn btn-outline-secondary" id="nav-login">Log In -></a>
                    <a href="{% url 'signup' %}" class="btn btn-primary ms-2" id="nav-signup">Sign Up -></a>
                </form>
            </div>
                {% endif %}
        </div>
    </div>
</nav>
<main style="color: #082434">
    <div class="container">
        {% block content %}
        {% endblock content %}
    </div>
</main>
    <!-- Bootstrap JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
