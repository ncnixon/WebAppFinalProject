{% extends "base.html" %}

{% block title %}OnlyFriends{% endblock title %}

{% block content %}
{% if user.is_authenticated %}
<p style="margin: 0; padding-top: 1rem; padding-bottom: 1rem;">Hi {{ user.username }}!</p>
<form action="{% url 'logout' %}" method="post" style="padding-bottom: 2rem">
    {% csrf_token %}
    <button type="submit" style="background-color: #fdf1d8; color: #082434; border-color: #082434;">Log Out</button> |
    <a href="{% url 'student_profile' %}" style="text-decoration-style: dotted; color:#31718a">Profile</a>
</form>
<!-- <form action="{% url 'student_profile' %}" method="post" style="padding-bottom: 2rem">
    {% csrf_token %}
    <button type="submit" style="background-color: #fdf1d8; color: #082434; border-color: #082434;">Profile</button>
</form> -->
{% else %}
<p style="padding-top: 1rem">You are not logged in</p>
<a href="{% url 'login' %}" style="text-decoration-style: dotted; color:#31718a">Log In</a> |
<a href="{% url 'signup' %}" style="text-decoration-style: dotted; color:#31718a">Sign Up</a>
{% endif %}

{% endblock content %}
